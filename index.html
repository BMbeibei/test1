<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="家庭行事曆"><title>我們的家庭｜行事曆＋記帳</title><style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif;background:#f6f7f9;color:#202124;-webkit-tap-highlight-color:transparent}.app{max-width:720px;margin:auto;min-height:100vh;padding-bottom:90px}header{background:#fff;padding:18px;position:sticky;top:0;z-index:5;border-bottom:1px solid #eee}.row{display:flex;justify-content:space-between;align-items:center;gap:10px}h1{font-size:22px;margin:0 0 4px}.sub,.muted{color:#777;font-size:13px}.tabs{display:flex;background:#fff;border-bottom:1px solid #eee;position:sticky;top:76px;z-index:4}.tab{flex:1;padding:13px;border:0;background:none;font-size:15px}.tab.active{font-weight:700;border-bottom:3px solid #222}.page{display:none}.page.active{display:block}main{padding:14px}.card{background:#fff;border-radius:16px;padding:15px;margin-bottom:13px;box-shadow:0 2px 10px #00000008}.title{font-weight:700}.balance{font-size:30px;font-weight:800;margin:5px 0 10px}.income{color:#16834b}.expense{color:#d64a4a}.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:10px}.dow{text-align:center;color:#888;font-size:12px;padding:5px}.day{min-height:72px;background:#fafafa;border-radius:8px;padding:6px;font-size:11px;overflow:hidden}.day b{font-size:14px}.event{margin-top:4px;padding:4px;border-radius:6px;line-height:1.2}.night{background:#e9e4ff}.late{background:#dfeeff}.holiday{background:#ffe9d8}.wife{background:#e4f5e9}.smallbtn,.primary,button{font:inherit;cursor:pointer}.smallbtn{border:1px solid #ddd;background:#fff;padding:8px 11px;border-radius:9px}.primary{border:0;background:#222;color:#fff;padding:10px 14px;border-radius:10px;font-weight:700}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.statgrid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.stat{background:#f8f8f8;border-radius:12px;padding:11px}.stat strong{display:block;font-size:19px;margin-top:3px}.list{display:flex;flex-direction:column;gap:8px}.item{padding:12px;border:1px solid #eee;border-radius:12px;background:#fff}.pill{display:inline-block;padding:4px 8px;border-radius:99px;font-size:11px;background:#eee}.auto{background:#e5f5ea}.alert{border-left:4px solid #e1a900;background:#fff9e5;padding:12px;border-radius:10px}.fab{position:fixed;right:18px;bottom:20px;width:58px;height:58px;border-radius:50%;border:0;background:#222;color:#fff;font-size:28px;box-shadow:0 6px 20px #0003;z-index:10}.modal{display:none;position:fixed;inset:0;background:#0006;z-index:20;align-items:flex-end}.modal.show{display:flex}.sheet{background:#fff;width:100%;max-height:88vh;overflow:auto;border-radius:20px 20px 0 0;padding:20px}.field{margin:10px 0}.field label{display:block;font-size:13px;color:#666;margin-bottom:5px}.field input,.field select,.field textarea{width:100%;padding:12px;border:1px solid #ddd;border-radius:10px;font-size:16px;background:#fff}.sheet h2{margin:0 0 12px}.empty{text-align:center;color:#888;padding:20px}.danger{color:#c33}.toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}@media(min-width:760px){.fab{right:calc(50% - 340px)}}
</style></head><body><div class="app"><header><div class="row"><div><h1>🏠 我們的家庭</h1><div class="sub">老公 👨　老婆 👩　資料保存在本機</div></div><button class="smallbtn" onclick="openSettings()">⚙️</button></div></header><div class="tabs"><button class="tab active" onclick="showPage('calendar',this)">📅 行事曆</button><button class="tab" onclick="showPage('money',this)">💰 記帳</button></div><main><section id="calendar" class="page active"><div class="card"><div class="toolbar"><button class="smallbtn" onclick="changeMonth(-1)">‹</button><div class="title" id="monthTitle"></div><button class="smallbtn" onclick="changeMonth(1)">›</button></div><div class="grid" id="calendarGrid"></div></div><div class="card"><div class="row"><div><div class="title" id="todayTitle"></div><div class="muted" id="todaySummary"></div></div></div><div class="actions"><button class="primary" onclick="openEventModal()">＋ 新增行程</button><button class="smallbtn" onclick="quickShift()">快速新增班別</button></div></div><div class="card"><div class="title">本月班表</div><div class="statgrid" style="margin-top:10px"><div class="stat">小夜班<strong id="nightCount">0</strong></div><div class="stat">大夜班<strong id="lateCount">0</strong></div><div class="stat">假日班<strong id="holidayCount">0</strong></div><div class="stat">共同活動<strong id="jointCount">0</strong></div></div></div></section><section id="money" class="page"><div class="card"><div class="muted" id="moneyMonth"></div><div class="balance" id="balance">$0</div><div class="statgrid"><div class="stat income">收入<strong id="income">$0</strong></div><div class="stat expense">支出<strong id="expense">$0</strong></div></div><div class="actions"><button class="primary" onclick="openMoneyModal('expense')">＋ 支出</button><button class="smallbtn" onclick="openMoneyModal('income')">＋ 收入</button><button class="smallbtn" onclick="openMoneyModal('transfer')">🔄 轉帳</button></div></div><div class="card"><div class="row"><div class="title">🏦 帳戶與信用卡</div><button class="smallbtn" onclick="openAccountModal()">＋</button></div><div class="list" style="margin-top:10px" id="accounts"></div></div><div class="card"><div class="title">📋 最近交易</div><div class="list" style="margin-top:10px" id="transactions"></div></div><div class="card"><div class="title">📊 本月支出分類</div><div class="list" style="margin-top:10px" id="categories"></div></div></section></main><button class="fab" onclick="openQuick()">＋</button></div>
<div class="modal" id="modal"><div class="sheet"><div class="row"><h2 id="modalTitle">新增</h2><button class="smallbtn" onclick="closeModal()">✕</button></div><div id="modalBody"></div></div></div>
<script>
const KEY='family_calendar_money_v2';let data=JSON.parse(localStorage.getItem(KEY)||'null')||{events:[{id:1,date:'2026-09-09',title:'老公大夜班',type:'late',time:'00:00–12:00',person:'老公'},{id:2,date:'2026-09-10',title:'老公小夜',type:'night',time:'16:00–隔日04:00',person:'老公'},{id:3,date:'2026-09-11',title:'老婆行程',type:'wife',time:'休假',person:'老婆'},{id:4,date:'2026-09-12',title:'老公假日班',type:'holiday',time:'08:30–20:30',person:'老公'},{id:5,date:'2026-09-12',title:'晚餐',type:'normal',time:'21:00',person:'共同'}],accounts:[{id:1,name:'中國信託 A 帳戶',owner:'老婆',balance:50000},{id:2,name:'中國信託 B 帳戶',owner:'老婆',balance:30000},{id:3,name:'中信 LINE Pay 卡',owner:'老婆',balance:-8350}],transactions:[{id:1,date:'2026-09-09',name:'Uber Eats',amount:-350,category:'飲食',account:'中信 LINE Pay 卡',owner:'老婆'},{id:2,date:'2026-09-09',name:'薪資入帳',amount:38000,category:'收入',account:'中國信託 A 帳戶',owner:'老婆'},{id:3,date:'2026-09-09',name:'A → B',amount:0,category:'轉帳',account:'中國信託 A 帳戶',owner:'老婆',note:'轉入 B 帳戶'}]};let view=new Date();function save(){localStorage.setItem(KEY,JSON.stringify(data))}function money(n){return (n<0?'-$':'$')+Math.abs(Math.round(n)).toLocaleString('zh-TW')}function iso(d){return d.toISOString().slice(0,10)}function showPage(id,btn){document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));document.getElementById(id).classList.add('active');document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));btn.classList.add('active');render()}function changeMonth(n){view.setMonth(view.getMonth()+n);renderCalendar()}function render(){renderCalendar();renderMoney()}function renderCalendar(){let y=view.getFullYear(),m=view.getMonth();document.getElementById('monthTitle').textContent=`${y} 年 ${m+1} 月`;let g=document.getElementById('calendarGrid');g.innerHTML=['日','一','二','三','四','五','六'].map(x=>`<div class="dow">${x}</div>`).join('');let first=new Date(y,m,1).getDay(),days=new Date(y,m+1,0).getDate();for(let i=0;i<first;i++)g.innerHTML+='<div></div>';for(let d=1;d<=days;d++){let dt=new Date(y,m,d),key=iso(dt),ev=data.events.filter(e=>e.date===key);g.innerHTML+=`<div class="day" onclick="openDay('${key}')"><b>${d}</b>${ev.map(e=>`<div class="event ${e.type}">${e.title}<br>${e.time||''}</div>`).join('')}</div>`}let now=new Date();document.getElementById('todayTitle').textContent=`今天 ${now.getMonth()+1}/${now.getDate()}`;let today=data.events.filter(e=>e.date===iso(now));document.getElementById('todaySummary').textContent=today.length?today.map(e=>e.title+' '+(e.time||'')).join('、'):'今天沒有行程';let ev=data.events.filter(e=>{let d=new Date(e.date);return d.getFullYear()===y&&d.getMonth()===m});document.getElementById('nightCount').textContent=ev.filter(e=>e.type==='night').length;document.getElementById('lateCount').textContent=ev.filter(e=>e.type==='late').length;document.getElementById('holidayCount').textContent=ev.filter(e=>e.type==='holiday').length;document.getElementById('jointCount').textContent=ev.filter(e=>e.person==='共同').length}function openDay(date){openEventModal(date)}
function openEventModal(date=iso(new Date())){modalTitle.textContent='新增行程';modalBody.innerHTML=`<div class="field"><label>日期</label><input id="fdate" type="date" value="${date}"></div><div class="field"><label>誰的行程</label><select id="fperson"><option>老公</option><option>老婆</option><option>共同</option></select></div><div class="field"><label>類型</label><select id="ftype"><option value="normal">一般</option><option value="night">小夜班</option><option value="late">大夜班</option><option value="holiday">假日班</option><option value="wife">休假</option></select></div><div class="field"><label>名稱</label><input id="ftitle" placeholder="例如：晚餐、上班、旅行"></div><div class="field"><label>時間</label><input id="ftime" placeholder="例如 18:00–21:00"></div><div class="actions"><button class="primary" onclick="addEvent()">儲存</button></div>`;modal.classList.add('show')}function addEvent(){data.events.push({id:Date.now(),date:fdate.value,person:fperson.value,type:ftype.value,title:ftitle.value||'行程',time:ftime.value});save();closeModal();render()}function quickShift(){openEventModal();setTimeout(()=>{ftype.value='night';ftitle.value='老公小夜班';ftime.value='16:00–隔日04:00'},0)}
function renderMoney(){let now=new Date(),y=now.getFullYear(),m=now.getMonth();document.getElementById('moneyMonth').textContent=`${y} 年 ${m+1} 月家庭收支`;let tx=data.transactions.filter(t=>{let d=new Date(t.date);return d.getFullYear()===y&&d.getMonth()===m});let inc=tx.filter(t=>t.amount>0).reduce((a,t)=>a+t.amount,0),exp=tx.filter(t=>t.amount<0).reduce((a,t)=>a+Math.abs(t.amount),0);document.getElementById('income').textContent=money(inc);document.getElementById('expense').textContent=money(exp);document.getElementById('balance').textContent=money(inc-exp);document.getElementById('accounts').innerHTML=data.accounts.length?data.accounts.map(a=>`<div class="item"><div class="row"><div>🏦 ${a.name}<br><span class="muted">${a.owner}</span></div><b>${money(a.balance)}</b></div></div>`).join(''):'<div class="empty">尚無帳戶</div>';document.getElementById('transactions').innerHTML=tx.slice().reverse().map(t=>`<div class="item"><div class="row"><div>${t.name}<br><span class="muted">${t.date}・${t.account||''}</span></div><b class="${t.amount<0?'expense':'income'}">${t.amount?money(t.amount):'轉帳'}</b></div><span class="pill auto">${t.category}</span></div>`).join('')||'<div class="empty">尚無交易</div>';let cats={};tx.filter(t=>t.amount<0).forEach(t=>cats[t.category]=(cats[t.category]||0)+Math.abs(t.amount));document.getElementById('categories').innerHTML=Object.entries(cats).map(([k,v])=>`<div class="row"><span>${k}</span><b>${money(v)}</b></div>`).join('')||'<div class="empty">本月尚無支出</div>'}
function openMoneyModal(kind){let title=kind==='income'?'新增收入':kind==='transfer'?'新增轉帳':'新增支出';modalTitle.textContent=title;modalBody.innerHTML=`<div class="field"><label>日期</label><input id="mdate" type="date" value="${iso(new Date())}"></div><div class="field"><label>名稱</label><input id="mname" placeholder="例如：薪資、晚餐"></div><div class="field"><label>金額</label><input id="mamount" type="number" inputmode="decimal" placeholder="0"></div>${kind!=='transfer'?`<div class="field"><label>分類</label><select id="mcat"><option>飲食</option><option>日用品</option><option>交通</option><option>訂閱／3C</option><option>居家</option><option>娛樂</option><option>收入</option><option>其他</option></select></div>`:'<div class="field"><label>備註</label><input id="mnote" placeholder="例如 A → B"></div>'}<div class="field"><label>帳戶</label><select id="macc">${data.accounts.map(a=>`<option>${a.name}</option>`).join('')}</select></div><div class="actions"><button class="primary" onclick="addMoney('${kind}')">儲存</button></div>`;modal.classList.add('show')}function addMoney(kind){let amount=Number(mamount.value)||0;if(!amount)return alert('請輸入金額');let acc=macc.value;data.transactions.push({id:Date.now(),date:mdate.value,name:mname.value|| (kind==='income'?'收入':kind==='transfer'?'轉帳':'支出'),amount:kind==='expense'?-Math.abs(amount):kind==='income'?Math.abs(amount):0,category:kind==='transfer'?'轉帳':mcat.value,account:acc,owner:'家庭',note:kind==='transfer'?(mnote.value||'') :''});if(kind!=='transfer'){let a=data.accounts.find(x=>x.name===acc);if(a)a.balance+=kind==='income'?amount:-amount}save();closeModal();renderMoney()}function openAccountModal(){modalTitle.textContent='新增帳戶';modalBody.innerHTML=`<div class="field"><label>帳戶名稱</label><input id="aname" placeholder="例如：國泰世華 A 帳戶"></div><div class="field"><label>持有人</label><select id="aowner"><option>老公</option><option>老婆</option><option>共同</option></select></div><div class="field"><label>目前餘額</label><input id="abal" type="number" inputmode="decimal" value="0"></div><div class="actions"><button class="primary" onclick="addAccount()">儲存</button></div>`;modal.classList.add('show')}function addAccount(){if(!aname.value.trim())return alert('請輸入帳戶名稱');data.accounts.push({id:Date.now(),name:aname.value.trim(),owner:aowner.value,balance:Number(abal.value)||0});save();closeModal();renderMoney()}function openQuick(){modalTitle.textContent='快速新增';modalBody.innerHTML=`<div class="actions"><button class="primary" onclick="closeModal();openEventModal()">📅 行程</button><button class="primary" onclick="closeModal();openMoneyModal('income')">💰 收入</button><button class="primary" onclick="closeModal();openMoneyModal('expense')">💸 支出</button><button class="primary" onclick="closeModal();openMoneyModal('transfer')">🔄 轉帳</button></div>`;modal.classList.add('show')}function openSettings(){modalTitle.textContent='家庭設定';modalBody.innerHTML=`<p>目前資料會保存在這台 iPhone 的瀏覽器本機儲存空間。</p><div class="actions"><button class="smallbtn" onclick="exportData()">匯出備份</button><button class="smallbtn" onclick="importPrompt()">匯入備份</button><button class="smallbtn danger" onclick="resetData()">清除全部資料</button></div>`;modal.classList.add('show')}function exportData(){let a=document.createElement('a');a.href='data:application/json;charset=utf-8,'+encodeURIComponent(JSON.stringify(data));a.download='家庭行事曆記帳備份.json';a.click()}function importPrompt(){alert('若要匯入備份，請使用 Safari 的檔案選擇功能；此簡易版建議先保留目前資料。')}function resetData(){if(confirm('確定清除全部資料？')){localStorage.removeItem(KEY);location.reload()}}function closeModal(){modal.classList.remove('show')}window.onclick=e=>{if(e.target===modal)closeModal()};render();
</script></body></html>
